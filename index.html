<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的第一个测试网页</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #f6f7f9; color: #111; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 72px 24px; }
    .card { background: #fff; border-radius: 20px; padding: 40px; box-shadow: 0 12px 40px rgba(0,0,0,.08); }
    h1 { font-size: 42px; margin: 0 0 16px; }
    p { font-size: 18px; line-height: 1.7; color: #444; }
    .badge { display: inline-block; margin-top: 18px; padding: 10px 14px; border-radius: 999px; background: #111; color: #fff; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>你好，这是我的第一个 GitHub 网页 👋</h1>
      <p>这个页面已经保存在我的 <strong>test-repo</strong> 仓库里。</p>
      <p>以后我可以继续让 ChatGPT 帮我修改文字、增加图片、做产品展示页，或者把它变成真正的网站。</p>
      <span class="badge">GitHub + ChatGPT 已连接成功</span>
    </div>
  </div>
</body>
</html>
